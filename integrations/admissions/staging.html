<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAPPY Minds intake staging</title>
<style>body{font:16px system-ui;max-width:650px;margin:32px auto;padding:20px;background:#fbf7ef;color:#0f172a}label{display:block;margin:16px 0}input,select,textarea,button{box-sizing:border-box;display:block;width:100%;padding:12px;font:inherit}button{background:#0f172a;color:white}pre{white-space:pre-wrap}</style>
<h1>Admissions intake staging</h1><p>Use synthetic test details only. This page never sends to Formspree.</p>
<label>Staging proxy endpoint<input id="endpoint" type="url" placeholder="https://…/api/enquiries"></label>
<label>Turnstile public site key<input id="sitekey"></label><button id="configure">Load verification</button>
<form id="enquiry"><label>Enquiry type<select name="enquiryType"><option>general</option><option>admissions</option><option>campus-visit</option><option>parent-community</option></select></label><label>Parent<input name="parent" required maxlength="120" value="TEST Parent"></label><label>Phone<input name="phone" required value="9000000000"></label><label>Child<input name="child" maxlength="120" value="TEST Child"></label><label>Class<select name="interestedClass"><option value="">Select</option><option>Play School</option><option>Nursery</option><option>PP1 (LKG)</option><option>PP2 (UKG)</option><option>Class 1</option><option>Class 2</option><option>Class 3</option><option>Class 4</option><option>Class 5</option></select></label><label>Visit date<input name="visitDate" type="date"></label><label>Message<textarea name="message" maxlength="1500">TEST — synthetic integration check</textarea></label><div id="verification"></div><button type="submit">Test submission</button></form><button id="newRequest">Start new enquiry ID</button><pre id="receipt" role="status"></pre>
<script type="module">
import {sendEnquiry} from './client.mjs';
const form=document.querySelector('#enquiry'), output=document.querySelector('#receipt');
let requestId=crypto.randomUUID(), widget, loaded=false, pending=false;
document.querySelector('#configure').onclick=()=>{
  if(loaded)return;loaded=true;
  const script=document.createElement('script');script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
  script.onload=()=>{widget=turnstile.render('#verification',{sitekey:document.querySelector('#sitekey').value.trim(),action:'admissions'});};
  document.head.append(script);
};
document.querySelector('#newRequest').onclick=()=>{if(!pending){requestId=crypto.randomUUID();output.textContent='New request ID. Complete verification before submitting.';if(widget!==undefined)turnstile.reset(widget);}};
form.onsubmit=async event=>{
  event.preventDefault();if(pending)return;
  const token=widget!==undefined?turnstile.getResponse(widget):'';
  if(!token){output.textContent='Complete verification first.';return;}
  pending=true;const button=form.querySelector('button');button.disabled=true;
  try{const result=await sendEnquiry(document.querySelector('#endpoint').value.trim(),Object.fromEntries([...new FormData(form)].filter(([k])=>k!=='cf-turnstile-response')),token,requestId);output.textContent=JSON.stringify(result,null,2);}
  catch(error){output.textContent=error.message;}
  finally{pending=false;button.disabled=false;turnstile.reset(widget);}
};
</script></html>
